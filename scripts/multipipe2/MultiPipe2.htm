<html xmlns:moi>
	<head>
		<link rel="stylesheet" href="moi://ui/moi.css" type="text/css">
	</head>
	<body class="commandbody">
		<div class="commandheader">
			<div id="SelectPrompt" class="commandprompt">Select curves for MultiPipe2, then press Done</div>
			<div id="OptionsPrompt" class="hiddencommandui">Set the options, then press Done</div>
			<div id="BuildingPrompt" class="hiddencommandui">Building the pipe frame, please wait</div>
			<div id="SummaryPrompt" class="hiddencommandui">Press Done to keep it, or Cancel to add nothing</div>
		</div>
		<table id="Options" class="hiddencommandui">
			<!-- Each option's label is its own text, not a textid: MoI's string table has no entry for these names,
			     and a missing textid could come out blank. Cage surfaces and Cage solid give the curves for now. -->
			<tr><td>Output:</td><td><moi:Select id="output">
					<moi:Option value="frame">Pipe frame</moi:Option>
					<moi:Option value="curves">Cage curves</moi:Option>
					<moi:Option value="surfaces">Cage surfaces</moi:Option>
					<moi:Option value="solid">Cage solid</moi:Option>
				</moi:Select></td></tr>
			<tr><td>Radius:</td><td><moi:DistanceInput id="radius" default="0.5" /></td></tr>
			<tr><td>Node size:</td><td><moi:NumericInput id="nodesize" default="1.6" /></td></tr>
			<!-- The number applies only with Auto off; MultiPipe2.js sets the same state when the options show. -->
			<tr><td>Divisions:</td><td><moi:CheckButton id="auto" default="true" onclick="moi.ui.commandUI.divisions.disabled = this.value;">Auto</moi:CheckButton>
				<moi:NumericInput id="divisions" default="0" /></td></tr>
			<tr><td>Cap:</td><td><moi:CheckButton id="cap" default="true">On</moi:CheckButton></td></tr>
			<tr><td>Round joints:</td><td><moi:CheckButton id="roundJoints" default="false" onclick="moi.ui.commandUI.allNodes.disabled = !this.value;">On</moi:CheckButton></td></tr>
			<tr><td>All nodes:</td><td><moi:CheckButton id="allNodes" default="false">On</moi:CheckButton></td></tr>
		</table>
		<div id="Summary" class="hiddencommandui"></div>
		<moi:CommandDoneCancel />
	</body>
</html>
